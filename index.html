<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover asegura que el fondo cubra toda la pantalla en iPhone con notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>arte underground_</title>

  <!-- Tipografías de Adobe Typekit (Akzidenz-Grotesk Next Pro & Owners) -->
  <link rel="stylesheet" href="https://use.typekit.net/qab2lff.css" />

  <style>
    /* ==========================================================================
       1. VARIABLES DE DISEÑO Y RESET BASE
       ========================================================================== */
    :root {
      --bg-color: #ffffff;
      --ink-color: #000000;
      --accent-yellow: #f3e600;
      --frame-border: 14px;

      /* Familias tipográficas con respaldo local/sistema */
      --font-index: 'akzidenz-grotesk-next-pro', 'Akzidenz-Grotesk Next Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-body: 'owners', 'Owners', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* Evita selección accidental de texto al arrastrar el dedo para pintar */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      /* 100dvh adapta la altura real en Safari iOS y Chrome Android */
      min-height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--ink-color);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       2. CAPA DEL MOTOR DE GRAFITI (SOLO HOME PAGE)
       ========================================================================== */
    #graffiti-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
      display: block;
      /* Bloquea el scroll/zoom nativo al deslizar el dedo para que pinte fluido */
      touch-action: none;
      cursor: crosshair;
    }

    /* ==========================================================================
       3. CONTENEDOR PRINCIPAL DE LA HOME (LAYOUT ADAPTATIVO)
       ========================================================================== */
    .home-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100dvh;
      /* Permite que los clics y arrastres en espacios blancos lleguen al canvas */
      pointer-events: none;

      /* Estructura Mobile-First (Vertical, fiel al diseño móvil) */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        calc(24px + env(safe-area-inset-top))
        calc(24px + env(safe-area-inset-right))
        calc(36px + env(safe-area-inset-bottom))
        calc(24px + env(safe-area-inset-left));
    }

    /* --- Bloque 1: Logo --- */
    .brand-logo {
      align-self: flex-start;
      pointer-events: auto; /* Evita pintar encima del logo */
      display: inline-block;
    }

    .brand-logo img {
      display: block;
      width: clamp(115px, 32vw, 155px);
      height: auto;
      object-fit: contain;
    }

    /* --- Bloque 2: Índice de Navegación (Akzidenz-Grotesk Next Pro Medium) --- */
    .main-nav {
      align-self: center;
      display: flex;
      justify-content: center;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      /* Mantiene el borde derecho recto con el guion bajo y centra el bloque */
      align-items: flex-end;
      gap: clamp(6px, 1.4vh, 12px);
    }

    .nav-item {
      pointer-events: auto; /* Reactiva interacción solo sobre el enlace */
    }

    .nav-link {
      display: inline-block;
      text-decoration: none;
      font-family: var(--font-index);
      font-weight: 500; /* Medium */
      color: var(--ink-color);
      background-color: transparent;
      font-size: clamp(1.55rem, 6.2vw, 2.5rem);
      letter-spacing: -0.025em;
      line-height: 1.15;
      padding: 2px 10px;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    /* Hover en escritorio + estado activo/foco al tocar en iOS/Android */
    .nav-link:hover,
    .nav-link:focus-visible,
    .nav-link:active {
      background-color: var(--ink-color);
      color: var(--accent-yellow);
      outline: none;
    }

    /* --- Bloque 3: Manifiesto / Descripción del costado (Owners Medium) --- */
    .brand-manifesto {
      align-self: center;
      width: 100%;
      max-width: 265px;
      pointer-events: auto;
    }

    .brand-manifesto p {
      font-family: var(--font-body);
      font-weight: 500; /* Medium */
      font-size: clamp(0.88rem, 3.6vw, 1rem);
      line-height: 1.25;
      letter-spacing: -0.015em;
      /* Justificado completo en todas las líneas, incluida la última */
      text-align: justify;
      text-align-last: justify;
    }

    /* ==========================================================================
       4. BOTÓN LIMPIAR MURO (HERRAMIENTA DEL GRAFITI)
       ========================================================================== */
    #clear-spray-btn {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: calc(18px + env(safe-area-inset-right));
      z-index: 10;
      font-family: var(--font-index);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.01em;
      padding: 6px 12px;
      background-color: var(--ink-color);
      color: var(--accent-yellow);
      border: none;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, background-color 0.15s ease, color 0.15s ease;
    }

    #clear-spray-btn.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    #clear-spray-btn:hover,
    #clear-spray-btn:active {
      background-color: var(--accent-yellow);
      color: var(--ink-color);
    }

    /* ==========================================================================
       5. VISTA ESCRITORIO / TABLET HORIZONTAL (>= 900px)
       ========================================================================== */
    @media (min-width: 900px) {
      .home-shell {
        /* Marco negro exterior visto en la referencia de escritorio */
        border: var(--frame-border) solid var(--ink-color);
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        column-gap: clamp(32px, 5vw, 80px);
        padding: 40px clamp(40px, 6vw, 90px);
      }

      .brand-logo {
        align-self: center;
      }

      .brand-logo img {
        width: clamp(130px, 12vw, 175px);
      }

      .main-nav {
        justify-self: center;
      }

      .nav-list {
        gap: clamp(8px, 1.3vh, 14px);
      }

      .nav-link {
        font-size: clamp(2rem, 3.1vw, 3rem);
        padding: 2px 14px;
      }

      .brand-manifesto {
        align-self: center;
        max-width: 310px;
      }

      .brand-manifesto p {
        font-size: clamp(1rem, 1.25vw, 1.22rem);
      }

      #clear-spray-btn {
        bottom: calc(var(--frame-border) + 14px);
        right: calc(var(--frame-border) + 18px);
      }
    }
  </style>
</head>
<body>

  <!-- LIENZO INTERACTIVO DE GRAFITI (Fondo exclusivo de la Home Page) -->
  <canvas id="graffiti-canvas" aria-label="Lienzo de grafiti con aerosol"></canvas>

  <!-- ESTRUCTURA PRINCIPAL DE LA HOME PAGE -->
  <main class="home-shell" id="home-view">

    <!-- 1. LOGO DE LA MARCA (Reemplaza el src con la ruta de tu PNG) -->
    <a href="#inicio" class="brand-logo" aria-label="arte underground_ inicio">
      <img
        src="ruta/a/tu-logo.png"
        alt="arte underground_"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
      />
      <!-- Respaldo tipográfico automático mientras vinculas tu archivo PNG -->
      <span style="display:none; font-family:var(--font-index); font-weight:500; font-size:1.7rem; line-height:0.9; letter-spacing:-0.03em;">
        arte<br>under<br>ground_
      </span>
    </a>

    <!-- 2. ÍNDICE DE NAVEGACIÓN -->
    <nav class="main-nav" aria-label="Menú principal">
      <ul class="nav-list">
        <li class="nav-item"><a href="#tikets" class="nav-link" data-section="tikets">Tikets_</a></li>
        <li class="nav-item"><a href="#exposiciones" class="nav-link" data-section="exposiciones">Exposiciones_</a></li>
        <li class="nav-item"><a href="#entrevistas" class="nav-link" data-section="entrevistas">Entrevistas_</a></li>
        <li class="nav-item"><a href="#blog" class="nav-link" data-section="blog">Blog_</a></li>
        <li class="nav-item"><a href="#merch" class="nav-link" data-section="merch">Merch_</a></li>
        <li class="nav-item"><a href="#directorio" class="nav-link" data-section="directorio">Directorio Artistas_</a></li>
        <li class="nav-item"><a href="#quienes-somos" class="nav-link" data-section="quienes-somos">Quien somos_</a></li>
      </ul>
    </nav>

    <!-- 3. PEQUEÑA DESCRIPCIÓN / MANIFIESTO -->
    <aside class="brand-manifesto">
      <p>
        Somos una plataforma de arte dedicada a producir exposiciones artísticas y a alzar la voz ante problemas sociales.
      </p>
    </aside>

  </main>

  <!-- BOTÓN PARA LIMPIAR EL AEROSOL -->
  <button id="clear-spray-btn" type="button" title="Limpiar trazos de grafiti (Tecla C)">
    Limpiar muro_
  </button>

  <script>
    /**
     * MOTOR DE GRAFITI INTERACTIVO (Módulo encapsulado)
     * - Activo únicamente mientras la Home Page está visible.
     * - Compatible con mouse (escritorio) y eventos táctiles (iOS / Android).
     */
    const GraffitiEngine = (() => {
      const canvas = document.getElementById('graffiti-canvas');
      const ctx = canvas.getContext('2d');
      const clearBtn = document.getElementById('clear-spray-btn');

      let isEnabled = true;
      let isSpraying = false;
      let lastX = 0;
      let lastY = 0;
      let hasPaint = false;
      let strokeCount = 0;

      // Paleta de aerosol sincronizada con la identidad (#0a0a0a y #f3e600)
      const sprayPalette = ['#0a0a0a', '#141414', '#f3e600', '#0a0a0a', '#0a0a0a'];
      let currentSprayColor = sprayPalette[0];

      // Ajusta la resolución del canvas a pantallas Retina / High-DPI sin borrar lo pintado
      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const temp = document.createElement('canvas');
        temp.width = canvas.width;
        temp.height = canvas.height;

        if (canvas.width > 0 && canvas.height > 0) {
          temp.getContext('2d').drawImage(canvas, 0, 0);
        }

        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);

        if (temp.width > 0 && temp.height > 0) {
          ctx.drawImage(temp, 0, 0, temp.width / dpr, temp.height / dpr);
        }
      }

      function revealClearButton() {
        if (!hasPaint && isEnabled) {
          hasPaint = true;
          clearBtn.classList.add('is-visible');
        }
      }

      function clearSpray() {
        const dpr = window.devicePixelRatio || 1;
        ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
        hasPaint = false;
        clearBtn.classList.remove('is-visible');
      }

      // Simula partículas de aerosol y escurrimiento (drip) al detenerse
      function sprayAt(x, y, speed = 0) {
        if (!isEnabled) return;

        const baseRadius = Math.max(11, 21 - Math.min(speed * 0.25, 8));
        const density = Math.floor(baseRadius * 4.4);

        for (let i = 0; i < density; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.pow(Math.random(), 1.65) * baseRadius;
          const px = x + Math.cos(angle) * dist;
          const py = y + Math.sin(angle) * dist;
          const alpha = (1 - dist / baseRadius) * (0.35 + Math.random() * 0.5);
          const dotSize = Math.random() < 0.78 ? 1.15 : 2.1;

          ctx.fillStyle = currentSprayColor;
          ctx.globalAlpha = alpha;
          ctx.fillRect(px, py, dotSize, dotSize);
        }

        // Efecto de goteo vertical cuando el trazo es lento
        if (speed < 3.5 && Math.random() < 0.045) {
          const dripLength = 10 + Math.random() * 34;
          const dripX = x + (Math.random() - 0.5) * 8;
          let currentDripY = y;

          const stepDrip = () => {
            if (currentDripY - y < dripLength && isEnabled) {
              ctx.globalAlpha = 0.65;
              ctx.fillStyle = currentSprayColor;
              ctx.beginPath();
              ctx.arc(dripX, currentDripY, 1.35, 0, Math.PI * 2);
              ctx.fill();
              currentDripY += 1.6;
              requestAnimationFrame(stepDrip);
            }
          };

          requestAnimationFrame(stepDrip);
        }

        ctx.globalAlpha = 1;
        revealClearButton();
      }

      // Interpola puntos entre coordenadas para trazos continuos al deslizar rápido
      function sprayLine(x0, y0, x1, y1) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        const distance = Math.hypot(dx, dy);
        const steps = Math.max(1, Math.floor(distance / 2.2));

        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          sprayAt(x0 + dx * t, y0 + dy * t, distance);
        }
      }

      // Eventos Pointer (unifica mouse, dedo en iOS/Android y stylus)
      canvas.addEventListener('pointerdown', (e) => {
        if (!isEnabled) return;
        if (e.button !== 0 && e.pointerType === 'mouse') return;

        isSpraying = true;
        lastX = e.clientX;
        lastY = e.clientY;
        currentSprayColor = sprayPalette[strokeCount % sprayPalette.length];
        strokeCount++;

        canvas.setPointerCapture(e.pointerId);
        sprayAt(lastX, lastY, 0);
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!isSpraying || !isEnabled) return;
        sprayLine(lastX, lastY, e.clientX, e.clientY);
        lastX = e.clientX;
        lastY = e.clientY;
      });

      const stopSpraying = (e) => {
        if (!isSpraying) return;
        isSpraying = false;
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
      };

      canvas.addEventListener('pointerup', stopSpraying);
      canvas.addEventListener('pointercancel', stopSpraying);
      clearBtn.addEventListener('click', clearSpray);

      window.addEventListener('keydown', (e) => {
        if (isEnabled && (e.key === 'c' || e.key === 'C')) {
          clearSpray();
        }
      });

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // Métodos públicos para activar/desactivar el motor al navegar a otras secciones
      return {
        enable() {
          isEnabled = true;
          canvas.style.display = 'block';
          if (hasPaint) clearBtn.classList.add('is-visible');
        },
        disable() {
          isEnabled = false;
          isSpraying = false;
          canvas.style.display = 'none';
          clearBtn.classList.remove('is-visible');
        },
        clear: clearSpray
      };
    })();
  </script>
</body>
</html>
