<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover asegura cobertura completa en pantallas con notch (iOS / Android) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>arte underground_</title>

  <!-- Tipografías de Adobe Typekit (Akzidenz-Grotesk Next Pro & Owners) -->
  <link rel="stylesheet" href="https://use.typekit.net/qab2lff.css" />

  <style>
    /* ==========================================================================
       1. VARIABLES DE DISEÑO Y RESET BASE
       ========================================================================== */
    :root {
      --bg-white: #ffffff;
      --bg-black: #000000;
      --ink-black: #000000;
      --ink-white: #ffffff;
      --accent-yellow: #f3e600;
      --frame-border: 14px;

      --font-index: 'akzidenz-grotesk-next-pro', 'Akzidenz-Grotesk Next Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-body: 'owners', 'Owners', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-white);
      color: var(--ink-black);
      font-family: var(--font-index);
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       2. MOTOR DE GRAFITI (EXCLUSIVO DE LA HOME PAGE)
       ========================================================================== */
    #graffiti-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
      display: block;
      touch-action: none;
      cursor: crosshair;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ==========================================================================
       3. HOME PAGE (LAYOUT ADAPTATIVO)
       ========================================================================== */
    .home-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100dvh;
      /* Permite que clics y arrastres en espacios libres lleguen al canvas */
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        calc(24px + env(safe-area-inset-top))
        calc(24px + env(safe-area-inset-right))
        calc(36px + env(safe-area-inset-bottom))
        calc(24px + env(safe-area-inset-left));
    }

    .brand-logo {
      align-self: flex-start;
      pointer-events: auto;
      display: inline-block;
      text-decoration: none;
    }

    .brand-logo img {
      display: block;
      width: clamp(115px, 32vw, 155px);
      height: auto;
      object-fit: contain;
    }

    /* Índice centrado con alineación derecha en los ítems */
    .main-nav {
      align-self: center;
      display: flex;
      justify-content: center;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: clamp(6px, 1.4vh, 12px);
    }

    .nav-item {
      pointer-events: auto;
    }

    /* La barra amarilla entra en seco (sin transition) */
    .nav-link {
      display: inline-block;
      text-decoration: none;
      font-family: var(--font-index);
      font-weight: 500;
      color: var(--ink-black);
      background-color: transparent;
      font-size: clamp(1.55rem, 6.2vw, 2.5rem);
      letter-spacing: -0.025em;
      line-height: 1.15;
      padding: 2px 10px;
      transition: none;
    }

    .nav-link:hover,
    .nav-link:focus-visible,
    .nav-link:active {
      background-color: var(--ink-black);
      color: var(--accent-yellow);
      outline: none;
    }

    /* Manifiesto justificado en todas las líneas */
    .brand-manifesto {
      align-self: center;
      width: 100%;
      max-width: 265px;
      pointer-events: auto;
    }

    .brand-manifesto p {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: clamp(0.88rem, 3.6vw, 1rem);
      line-height: 1.25;
      letter-spacing: -0.015em;
      text-align: justify;
      text-align-last: justify;
    }

    /* Botón limpiar muro (solo visible en Home cuando hay trazos) */
    #clear-spray-btn {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: calc(18px + env(safe-area-inset-right));
      z-index: 10;
      font-family: var(--font-index);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.01em;
      padding: 6px 12px;
      background-color: var(--ink-black);
      color: var(--accent-yellow);
      border: none;
      cursor: pointer;
      display: none;
    }

    #clear-spray-btn.is-visible {
      display: inline-block;
    }

    #clear-spray-btn:hover,
    #clear-spray-btn:active {
      background-color: var(--accent-yellow);
      color: var(--ink-black);
    }

    @media (min-width: 900px) {
      .home-shell {
        border: var(--frame-border) solid var(--ink-black);
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        column-gap: clamp(32px, 5vw, 80px);
        padding: 40px clamp(40px, 6vw, 90px);
      }

      .brand-logo {
        align-self: center;
      }

      .brand-logo img {
        width: clamp(130px, 12vw, 175px);
      }

      .main-nav {
        justify-self: center;
      }

      .nav-list {
        gap: clamp(8px, 1.3vh, 14px);
      }

      .nav-link {
        font-size: clamp(2rem, 3.1vw, 3rem);
        padding: 2px 14px;
      }

      .brand-manifesto {
        align-self: center;
        max-width: 310px;
      }

      .brand-manifesto p {
        font-size: clamp(1rem, 1.25vw, 1.22rem);
      }

      #clear-spray-btn {
        bottom: calc(var(--frame-border) + 14px);
        right: calc(var(--frame-border) + 18px);
      }
    }

    /* ==========================================================================
       4. TRANSICIÓN SÓLIDA DE ABAJO A ARRIBA (SIN DEGRADADO)
       ========================================================================== */
    .screen-wipe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background-color: var(--bg-black);
      z-index: 50;
      transform: translateY(100%);
      pointer-events: none;
      will-change: transform;
    }

    .screen-wipe.is-rising {
      transform: translateY(0%);
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screen-wipe.is-leaving {
      transform: translateY(-100%);
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ==========================================================================
       5. PESTAÑA TIKETS_ (FONDO NEGRO, TEXTO BLANCO, FRANJA AMARILLA -> BLANCO)
       ========================================================================== */
    .tickets-view {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 20;
      background-color: var(--bg-black);
      color: var(--ink-white);
      display: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding:
        calc(22px + env(safe-area-inset-top))
        calc(22px + env(safe-area-inset-right))
        calc(28px + env(safe-area-inset-bottom))
        calc(22px + env(safe-area-inset-left));
    }

    .tickets-view.is-active {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    /* Columna izquierda: Logo blanco + índice compacto */
    .tickets-sidebar {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
    }

    .tickets-logo {
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
    }

    .tickets-logo img {
      display: block;
      width: clamp(92px, 24vw, 128px);
      height: auto;
      object-fit: contain;
    }

    .tickets-mini-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tickets-mini-link {
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      font-family: var(--font-index);
      font-weight: 500;
      font-size: clamp(0.82rem, 2.8vw, 0.95rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--ink-white);
      cursor: pointer;
    }

    .tickets-mini-link.is-current {
      color: var(--accent-yellow);
    }

    .tickets-mini-link:hover,
    .tickets-mini-link:active {
      color: var(--accent-yellow);
    }

    /* Centro / Derecha: Evento + Botón COMPRAR + Fecha + Flyer */
    .tickets-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
    }

    .event-cta-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .event-title {
      font-family: var(--font-index);
      font-weight: 500;
      font-size: clamp(1.35rem, 5vw, 2.1rem);
      letter-spacing: -0.02em;
      color: var(--ink-white);
    }

    /* Franja amarilla por defecto; cambia a blanco al pasar cursor o tocar */
    .buy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--accent-yellow);
      color: var(--ink-black);
      border: none;
      cursor: pointer;
      font-family: var(--font-index);
      font-weight: 500;
      font-size: clamp(1.3rem, 4.8vw, 1.95rem);
      letter-spacing: -0.02em;
      padding: 4px 22px;
      transition: none;
    }

    .buy-btn:hover,
    .buy-btn:focus-visible,
    .buy-btn:active {
      background-color: var(--ink-white);
      color: var(--ink-black);
      outline: none;
    }

    .event-date {
      font-family: var(--font-index);
      font-weight: 500;
      font-size: clamp(1.2rem, 4.4vw, 1.8rem);
      letter-spacing: -0.02em;
      color: var(--ink-white);
    }

    /* Contenedor listo para FLYER PARED-06.png */
    .flyer-frame {
      width: min(82vw, 390px);
      aspect-ratio: 1 / 1.05;
      background-color: var(--ink-white);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .flyer-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Título grande Tikets_ inferior */
    .tickets-footer-title {
      font-family: var(--font-index);
      font-weight: 500;
      font-size: clamp(2.6rem, 11vw, 4.6rem);
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--ink-white);
      align-self: flex-start;
    }

    /* Vista escritorio (>= 900px) fiel a la referencia horizontal */
    @media (min-width: 900px) {
      .tickets-view.is-active {
        display: grid;
        grid-template-columns: 180px 1fr 240px;
        grid-template-rows: 1fr auto;
        align-items: center;
        padding: 36px 44px;
        gap: 24px 36px;
        overflow: hidden;
      }

      .tickets-sidebar {
        grid-column: 1;
        grid-row: 1;
        align-self: start;
      }

      .tickets-stage {
        grid-column: 2 / 4;
        grid-row: 1;
        display: grid;
        grid-template-columns: 1fr 240px;
        align-items: center;
        justify-items: center;
        gap: 32px;
      }

      .flyer-frame {
        grid-column: 1;
        width: min(38vw, 440px);
        max-height: 76dvh;
      }

      .event-cta-box {
        grid-column: 2;
      }

      .tickets-footer-title {
        grid-column: 1;
        grid-row: 2;
        align-self: end;
      }
    }
  </style>
</head>
<body>

    <h1 class="tickets-footer-title">Tikets_</h1>

  <script>
    /* ========================================================================
       MOTOR DE GRAFITI (SOLO ACTIVO EN LA HOME PAGE)
       ======================================================================== */
    const GraffitiEngine = (() => {
      const canvas = document.getElementById('graffiti-canvas');
      const ctx = canvas.getContext('2d');
      const clearBtn = document.getElementById('clear-spray-btn');

      let isEnabled = true;
      let isSpraying = false;
      let lastX = 0;
      let lastY = 0;
      let hasPaint = false;
      let strokeCount = 0;

      const sprayPalette = ['#0a0a0a', '#141414', '#f3e600', '#0a0a0a', '#0a0a0a'];
      let currentSprayColor = sprayPalette[0];

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const temp = document.createElement('canvas');
        temp.width = canvas.width;
        temp.height = canvas.height;

        if (canvas.width > 0 && canvas.height > 0) {
          temp.getContext('2d').drawImage(canvas, 0, 0);
        }

        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);

        if (temp.width > 0 && temp.height > 0) {
          ctx.drawImage(temp, 0, 0, temp.width / dpr, temp.height / dpr);
        }
      }

      function revealClearButton() {
        if (!hasPaint && isEnabled) {
          hasPaint = true;
          clearBtn.classList.add('is-visible');
        }
      }

      function clearSpray() {
        const dpr = window.devicePixelRatio || 1;
        ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
        hasPaint = false;
        clearBtn.classList.remove('is-visible');
      }

      function sprayAt(x, y, speed = 0) {
        if (!isEnabled) return;

        const baseRadius = Math.max(11, 21 - Math.min(speed * 0.25, 8));
        const density = Math.floor(baseRadius * 4.4);

        for (let i = 0; i < density; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.pow(Math.random(), 1.65) * baseRadius;
          const px = x + Math.cos(angle) * dist;
          const py = y + Math.sin(angle) * dist;
          const alpha = (1 - dist / baseRadius) * (0.35 + Math.random() * 0.5);
          const dotSize = Math.random() < 0.78 ? 1.15 : 2.1;

          ctx.fillStyle = currentSprayColor;
          ctx.globalAlpha = alpha;
          ctx.fillRect(px, py, dotSize, dotSize);
        }

        if (speed < 3.5 && Math.random() < 0.045) {
          const dripLength = 10 + Math.random() * 34;
          const dripX = x + (Math.random() - 0.5) * 8;
          let currentDripY = y;

          const stepDrip = () => {
            if (currentDripY - y < dripLength && isEnabled) {
              ctx.globalAlpha = 0.65;
              ctx.fillStyle = currentSprayColor;
              ctx.beginPath();
              ctx.arc(dripX, currentDripY, 1.35, 0, Math.PI * 2);
              ctx.fill();
              currentDripY += 1.6;
              requestAnimationFrame(stepDrip);
            }
          };

          requestAnimationFrame(stepDrip);
        }

        ctx.globalAlpha = 1;
        revealClearButton();
      }

      function sprayLine(x0, y0, x1, y1) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        const distance = Math.hypot(dx, dy);
        const steps = Math.max(1, Math.floor(distance / 2.2));

        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          sprayAt(x0 + dx * t, y0 + dy * t, distance);
        }
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (!isEnabled) return;
        if (e.button !== 0 && e.pointerType === 'mouse') return;

        isSpraying = true;
        lastX = e.clientX;
        lastY = e.clientY;
        currentSprayColor = sprayPalette[strokeCount % sprayPalette.length];
        strokeCount++;

        canvas.setPointerCapture(e.pointerId);
        sprayAt(lastX, lastY, 0);
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!isSpraying || !isEnabled) return;
        sprayLine(lastX, lastY, e.clientX, e.clientY);
        lastX = e.clientX;
        lastY = e.clientY;
      });

      const stopSpraying = (e) => {
        if (!isSpraying) return;
        isSpraying = false;
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
      };

      canvas.addEventListener('pointerup', stopSpraying);
      canvas.addEventListener('pointercancel', stopSpraying);
      clearBtn.addEventListener('click', clearSpray);

      window.addEventListener('keydown', (e) => {
        if (isEnabled && (e.key === 'c' || e.key === 'C')) {
          clearSpray();
        }
      });

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      return {
        enable() {
          isEnabled = true;
          canvas.style.display = 'block';
          if (hasPaint) clearBtn.classList.add('is-visible');
        },
        disable() {
          isEnabled = false;
          isSpraying = false;
          canvas.style.display = 'none';
          clearBtn.classList.remove('is-visible');
        }
      };
    })();

    /* ========================================================================
       NAVEGACIÓN Y TRANSICIÓN SÓLIDA DE ABAJO A ARRIBA (SIN DEGRADADO)
       ======================================================================== */
    (() => {
      const wipe = document.getElementById('screen-wipe');
      const homeView = document.getElementById('home-view');
      const ticketsView = document.getElementById('tickets-view');
      const backHomeBtn = document.getElementById('back-to-home-btn');
      const buyBtn = document.getElementById('buy-ticket-btn');

      let isTransitioning = false;

      function navigateTo(targetRoute) {
        if (isTransitioning) return;
        isTransitioning = true;

        // 1. Sube el telón negro sólido desde abajo
        wipe.classList.remove('is-leaving');
        void wipe.offsetWidth; // Reflow forzado para reiniciar la posición
        wipe.classList.add('is-rising');

        setTimeout(() => {
          if (targetRoute === 'tikets') {
            homeView.style.display = 'none';
            ticketsView.classList.add('is-active');
            document.body.style.backgroundColor = '#000000';
            GraffitiEngine.disable();
          } else {
            ticketsView.classList.remove('is-active');
            homeView.style.display = '';
            document.body.style.backgroundColor = '#ffffff';
            GraffitiEngine.enable();
          }

          // 2. Retira el telón hacia arriba para revelar la vista destino
          wipe.classList.remove('is-rising');
          wipe.classList.add('is-leaving');

          setTimeout(() => {
            wipe.style.transition = 'none';
            wipe.classList.remove('is-leaving');
            wipe.style.transform = 'translateY(100%)';
            void wipe.offsetWidth;
            wipe.style.transition = '';
            wipe.style.transform = '';
            isTransitioning = false;
          }, 350);
        }, 340);
      }

      // Enlaces del índice principal en la Home
      document.querySelectorAll('.nav-link').forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const route = link.dataset.route;
          if (route === 'tikets') {
            navigateTo('tikets');
          }
        });
      });

      // Volver a la Home desde el logo blanco o enlaces laterales en Tikets_
      backHomeBtn.addEventListener('click', () => navigateTo('home'));

      document.querySelectorAll('.tickets-mini-link').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.dataset.route === 'home') {
            navigateTo('home');
          }
        });
      });

      // Acción lista para conectar tu link/pasarela de boletos de Expo II
      buyBtn.addEventListener('click', () => {
        // Ejemplo: window.open('TU_LINK_DE_BOLETOS', '_blank', 'noopener,noreferrer');
      });
    })();
  </script>
</body>
</html>
